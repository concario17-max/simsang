<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>영성 달력 · 심상 서재</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="calendar.css"><link rel="stylesheet" href="../shared.css?v=1"><script src="../shared.js?v=1"></script></head><body>
<header><a class="brand" href="../"><span class="seal">心</span><span>심상 서재<small>SIMSANG ARCHIVE</small></span></a><nav><a href="../#library">전체 서재</a><button id="openBookmarks">책갈피</button></nav><a class="subtle" href="https://calendar.simsang.org/" target="_blank" rel="noopener">기존 자료실 ↗</a></header>
<main class="calendar-main"><div class="calendar-title"><div><div class="eyebrow">CELESTIAL EPHEMERIS</div><h1>하루의 문을 여는 지혜</h1><p>주역과 헤르메스학, 영혼 달력을 함께 읽는 시간.</p></div><div class="date-controls"><button id="previousDate" aria-label="이전 날짜">←</button><label><span class="sr-only">읽을 날짜</span><input id="date" type="date" required min="1900-01-01" max="2199-12-31"></label><button id="nextDate" aria-label="다음 날짜">→</button><button id="todayButton">오늘</button></div></div>
<div class="calendar-bar"><div class="sources" role="group" aria-label="읽을 자료"><button data-source="yao">효사</button><button data-source="gua">괘사</button><button data-source="soul">영혼 달력</button></div><div class="quick-tools"><button id="allReadings">전체 목차</button><button id="bookmark">☆ 책갈피</button><button id="fontSize">가 +</button></div></div>
<div id="loadState" role="status">자료를 불러오고 있어요…</div><div id="readingLayout" class="calendar-layout" hidden><aside class="reading-summary"><div class="eyebrow" id="readingType"></div><img id="sigil" alt="" hidden><h2 id="readingTitle"></h2><p id="readingShort"></p><div id="relatedGua"></div><label id="bonusLabel" hidden>보너스 자료 선택<select id="bonusSelect"></select></label><div class="source-note">제공된 달력 저장소의 본문과 해설을 그대로 연결했어요. 날짜 배정은 기존 자료실의 규칙을 따릅니다.</div></aside><article class="reading-content"><div class="reading-tools"><div id="viewTabs"><button data-view="comic">학습만화</button><button data-view="text">본문</button><button data-view="commentary">해설</button><button data-view="note">사색 노트</button></div></div><div id="content"></div><div class="reader-bottom"><button id="bottomPrevious">← 이전날</button><span id="dateCaption"></span><button id="bottomNext">다음날 →</button></div></article></div></main>
<dialog id="imageViewer"><div class="image-tools"><span>학습만화 크게 보기</span><button id="zoomOut" aria-label="축소">−</button><button id="zoomIn" aria-label="확대">＋</button><button id="closeImage">닫기 ✕</button></div><div class="zoom-area"><img id="largeImage" alt="학습만화 확대"></div></dialog>
<dialog id="contentsDialog"><div class="modal-head"><h2 id="listTitle">전체 목차</h2><button id="closeContents" aria-label="닫기">✕</button></div><label for="findReading" class="sr-only">목차 검색</label><input id="findReading" type="search" placeholder="번호 또는 내용으로 찾기"><div id="listBody"></div></dialog><div id="toast" role="status"></div><script type="module" src="calendar.js"></script></body></html>
