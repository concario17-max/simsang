<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>문헌 읽기 · 심상 서재</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../calendar/calendar.css"><link rel="stylesheet" href="../yoga/yoga.css"><link rel="stylesheet" href="reader.css"><link rel="stylesheet" href="../shared.css?v=1"><script src="../shared.js?v=1"></script></head><body>
<header><a class="brand" href="../"><span class="seal">心</span><span>심상 서재<small>SIMSANG ARCHIVE</small></span></a><nav><a href="../#library">전체 서재</a><button id="saved">책갈피</button></nav></header>
<main class="calendar-main"><div class="calendar-title"><div><div class="eyebrow">READ · REFLECT · RETURN</div><h1 id="bookTitle">문헌을 펼치는 중</h1><p id="notice"></p></div><button id="resume">이어서 읽기 ↗</button></div>
<p id="loading" role="status">자료를 불러오고 있어요…</p><div class="calendar-layout" id="layout" hidden><aside class="reading-summary"><label for="chapterSelect">목차</label><select id="chapterSelect"></select><label for="verseSelect">구절·문단</label><select id="verseSelect"></select><label for="search">본문과 해설 검색</label><input id="search" type="search" placeholder="단어나 레슨 번호로 찾기"><div id="results"></div><div class="source-note"><p id="availability"></p><a id="sourceLink" target="_blank" rel="noopener">자료 출처 ↗</a><p>책갈피와 사색 노트는 이 브라우저에 저장돼요.</p></div></aside>
<article class="reading-content"><div class="reading-tools"><div id="viewTabs"><button data-view="text">본문·번역</button><button data-view="commentary">해설</button><button data-view="comic">학습만화</button><button data-view="note">사색 노트</button><button data-view="albums" id="albumTab" hidden>독송 앨범</button></div></div><div class="entry-heading"><h2 id="verseTitle"></h2><button id="bookmark" aria-pressed="false">☆ 책갈피</button></div><div id="content"></div><div class="reader-bottom"><button id="prev">← 이전</button><span id="position"></span><button id="next">다음 →</button></div></article></div></main>
<dialog id="savedDialog"><div class="modal-head"><h2>책갈피</h2><button id="closeSaved">닫기 ✕</button></div><div id="savedList"></div></dialog><dialog id="imageViewer"><div class="image-tools"><span>학습만화 크게 보기</span><button id="zoomOut" aria-label="축소">−</button><button id="zoomIn" aria-label="확대">＋</button><button id="closeImage">닫기 ✕</button></div><div class="zoom-area"><img id="largeImage" alt="학습만화 확대"></div></dialog><script type="module" src="reader.js"></script></body></html>
